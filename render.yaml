services:
  - type: web
    name: pathai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
        # Comma-separated list of Gemini API keys for rotation.
        # Example: key1,key2,key3
      - key: GROQ_API_KEY
        sync: false
        # Free Groq API key for fast fallback (get from console.groq.com)
